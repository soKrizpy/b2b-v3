name: Vite App CI

on:
  push:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"
  pull_request:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
