name: Vite App CI

on:
  push:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "vercel.json"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"
  pull_request:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install application dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser QA
        run: npx playwright test
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bits2bytes-playwright-report
          path: |
            vite-app/playwright-report/
            vite-app/test-results/
          if-no-files-found: ignore
          retention-days: 7
