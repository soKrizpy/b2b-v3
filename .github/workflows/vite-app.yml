name: Vite App CI

on:
  push:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "supabase/**"
      - "vercel.json"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"
  pull_request:
    branches: [preview]
    paths:
      - "vite-app/**"
      - "supabase/**"
      - "js/**"
      - "css/**"
      - "data/mock/**"
      - "logo-b2b-*.svg"
      - ".github/workflows/vite-app.yml"

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck admin identity Edge Function
        working-directory: .
        run: deno check supabase/functions/admin-manage-user/index.ts
      - name: Test admin deactivation security invariants
        working-directory: .
        run: deno test supabase/functions/_shared/admin-deactivation.test.ts
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser QA
        env:
          VITE_SUPABASE_URL: https://b2b-e2e.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_test_key
        run: npx playwright test
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bits2bytes-playwright-report
          path: |
            vite-app/playwright-report/
            vite-app/test-results/
          if-no-files-found: ignore
          retention-days: 7
